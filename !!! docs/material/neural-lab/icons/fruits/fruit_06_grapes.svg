  <line x1="100" y1="45" x2="100" y2="62" stroke="#5D4037" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="112" cy="48" rx="14" ry="8" fill="#66BB6A" transform="rotate(-20 112 48)"/>
  <line x1="100" y1="50" x2="112" y2="46" stroke="#4CAF50" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Grapes cluster - back row -->
  <circle cx="84" cy="85" r="20" fill="#7B1FA2"/>
  <circle cx="116" cy="85" r="20" fill="#7B1FA2"/>
  <!-- Middle row -->
  <circle cx="68" cy="112" r="20" fill="#8E24AA"/>
  <circle cx="100" cy="112" r="20" fill="#8E24AA"/>
  <circle cx="132" cy="112" r="20" fill="#8E24AA"/>
  <!-- Front row -->
