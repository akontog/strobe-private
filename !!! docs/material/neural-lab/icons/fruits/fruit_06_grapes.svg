  <circle cx="78" cy="79" r="6" fill="white" opacity="0.35"/>
  <circle cx="110" cy="79" r="6" fill="white" opacity="0.35"/>
  <circle cx="62" cy="106" r="6" fill="white" opacity="0.35"/>
  <circle cx="94" cy="106" r="6" fill="white" opacity="0.35"/>
  <circle cx="126" cy="106" r="6" fill="white" opacity="0.35"/>
  <circle cx="78" cy="133" r="6" fill="white" opacity="0.35"/>
  <circle cx="110" cy="133" r="6" fill="white" opacity="0.35"/>
  <circle cx="94" cy="154" r="6" fill="white" opacity="0.35"/>
  <!-- Face on center grape -->
  <circle cx="95" cy="115" r="4" fill="#4A148C"/>
  <circle cx="107" cy="115" r="4" fill="#4A148C"/>
  <circle cx="96.5" cy="113.5" r="1.6" fill="white"/>
  <circle cx="108.5" cy="113.5" r="1.6" fill="white"/>
  <path d="M93 123 Q101 130 109 123" stroke="#4A148C" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <ellipse cx="88" cy="122" rx="7" ry="5" fill="#CE93D8" opacity="0.5"/>
  <ellipse cx="113" cy="122" rx="7" ry="5" fill="#CE93D8" opacity="0.5"/>
