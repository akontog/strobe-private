<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<title>Fruit Icons Preview</title>
<style>
  body { font-family: 'Segoe UI', sans-serif; background: #f9f4ef; margin: 0; padding: 30px; }
  h1 { text-align: center; color: #5D4037; font-size: 2rem; margin-bottom: 8px; }
  p { text-align: center; color: #888; margin-bottom: 30px; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 20px; max-width: 700px; margin: 0 auto; }
  .card { background: white; border-radius: 16px; padding: 16px 10px 10px; text-align: center; box-shadow: 0 4px 14px rgba(0,0,0,0.08); }
  .card img { width: 120px; height: 120px; }
  .card span { display: block; margin-top: 8px; font-size: 0.9rem; color: #555; font-weight: 600; }
</style>
</head>
<body>
<h1>🍓 Fruit Icon Set</h1>
<p>Cute cartoon style · 10 SVG icons</p>
<div class="grid">
  <div class="card"><img src="fruit_01_apple.svg"><span>Μήλο</span></div>
  <div class="card"><img src="fruit_02_banana.svg"><span>Μπανάνα</span></div>
  <div class="card"><img src="fruit_03_strawberry.svg"><span>Φράουλα</span></div>
  <div class="card"><img src="fruit_04_watermelon.svg"><span>Καρπούζι</span></div>
  <div class="card"><img src="fruit_05_orange.svg"><span>Πορτοκάλι</span></div>
  <div class="card"><img src="fruit_06_grapes.svg"><span>Σταφύλι</span></div>
  <div class="card"><img src="fruit_07_pineapple.svg"><span>Ανανάς</span></div>
  <div class="card"><img src="fruit_08_cherry.svg"><span>Κεράσι</span></div>
  <div class="card"><img src="fruit_09_lemon.svg"><span>Λεμόνι</span></div>
  <div class="card"><img src="fruit_10_peach.svg"><span>Ροδάκινο</span></div>
</div>
</body>
</html>
