<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Launcher</title>
  <link rel="stylesheet" href="/css/postit-cards.css">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="/js/postit-cards-react.js"></script>
  <style>
    :root {
      --bg: #fff9f1;
      --ink: #322514;
      --muted: #6f604d;
      --surface: #ffffff;
      --line: #eadcc8;
      --accent: #d97608;
      --accent-2: #0f6cbd;
      --shadow: 0 14px 28px rgba(17, 24, 39, 0.1);
      --danger: #b42318;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "Trebuchet MS", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 0%, rgba(217, 118, 8, 0.18), transparent 35%),
        linear-gradient(180deg, #fffbf5, var(--bg));
    }

    .wrap {
      width: min(1080px, 94vw);
      margin: 28px auto;
      display: grid;
      gap: 14px;
    }

    .top,
    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: var(--shadow);
      padding: 14px;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    h1 { margin: 0; font-size: clamp(1.15rem, 2vw, 1.4rem); }
    .muted { color: var(--muted); font-size: 0.92rem; }

    .home-link {
      text-decoration: none;
      border-radius: 10px;
      padding: 9px 12px;
      font-weight: 700;
      color: #fff;
      background: #9b1c1c;
    }

    .field-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .field-row label {
      font-weight: 700;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .field-row input {
      flex: 1;
      min-width: 220px;
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 9px 10px;
      font: inherit;
    }

    button {
      border: 0;
      border-radius: 9px;
      padding: 9px 12px;
      font-weight: 700;
      cursor: pointer;
      color: #fff;
      background: var(--accent-2);
    }

    button:hover,
    .open:hover,
    .direct:hover {
      filter: brightness(1.05);
    }

    .grid {
      display: grid;
      gap: 16px;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: var(--shadow);
      padding: 14px;
      display: grid;
      gap: 9px;
    }

    .title { font-weight: 700; }
    .slug { color: var(--muted); font-size: 0.85rem; }

    .btn-row {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
    }

    .open,
    .direct {
      text-decoration: none;
      text-align: center;
      border-radius: 9px;
      padding: 8px 10px;
      font-weight: 700;
      font-size: 0.9rem;
    }

    .open {
      background: var(--accent);
      color: #fff;
      border: 0;
      cursor: pointer;
    }

    .direct {
      background: #fff;
      color: #6b7280;
      border: 1px dashed #9ca3af;
    }

    #status {
      min-height: 20px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    #nameStatus {
      margin-top: 8px;
      color: var(--muted);
      font-size: 0.88rem;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div>
        <h1>Student App Launcher</h1>
        <div class="muted">Δώσε όνομα σύνδεσης και διάλεξε εφαρμογή.</div>
      </div>
      <a class="home-link" href="/">Αρχική</a>
    </header>

    <section class="panel">
      <div class="field-row">
        <label for="studentName">Όνομα σύνδεσης</label>
        <input id="studentName" type="text" placeholder="π.χ. Ομάδα-Α" maxlength="40">
        <button id="saveNameBtn" type="button">Αποθήκευση</button>
      </div>
      <div id="nameStatus">Αν ανοίξεις app με «σύνδεση», το όνομα περνάει έτοιμο.</div>
    </section>

    <section>
      <div class="muted" style="margin-bottom: 8px;">Εφαρμογές μαθητή</div>
      <div id="appGrid" class="grid"></div>
      <div id="status"></div>
    </section>
  </div>

  <script>
    const appGrid = document.getElementById('appGrid');
    const statusNode = document.getElementById('status');
    const nameInput = document.getElementById('studentName');
    const nameStatus = document.getElementById('nameStatus');
    const NAME_STORAGE_KEY = 'strobeStudentConnectName';

    const state = {
      studentName: '',
      apps: []
    };

    async function api(url) {
      const response = await fetch(url, { headers: { Accept: 'application/json' } });
      const payload = await response.json();

      if (!response.ok) {
        throw new Error(payload.error || 'Request failed');
      }

      return payload;
    }

    function setStatus(message, isError = false) {
      statusNode.textContent = message;
      statusNode.style.color = isError ? 'var(--danger)' : 'var(--muted)';
    }

    function loadName() {
      const stored = localStorage.getItem(NAME_STORAGE_KEY);
      state.studentName = String(stored || '').trim();
      nameInput.value = state.studentName;
      renderNameStatus();
    }

    function saveName() {
      state.studentName = nameInput.value.trim();
      localStorage.setItem(NAME_STORAGE_KEY, state.studentName);
      renderNameStatus();
    }

    function renderNameStatus() {
      if (!state.studentName) {
        nameStatus.textContent = 'Δεν έχει δοθεί όνομα. Σε direct app link θα φαίνεσαι disconnected μέχρι να συνδεθείς εκεί.';
        return;
      }

      nameStatus.textContent = `Τρέχον όνομα: ${state.studentName}`;
    }

    function appendParams(basePath, params) {
      const url = new URL(basePath, window.location.origin);
      Object.entries(params).forEach(([key, value]) => {
        if (value !== undefined && value !== null && String(value).length > 0) {
          url.searchParams.set(key, String(value));
        }
      });
      return `${url.pathname}${url.search}`;
    }

    function openAppConnected(app, launchPath = app.launchPath) {
      if (!state.studentName) {
        setStatus('Δώσε πρώτα όνομα σύνδεσης.', true);
        nameInput.focus();
        return;
      }

      const target = appendParams(launchPath, {
        name: state.studentName,
        autoconnect: '1'
      });

      window.location.href = target;
    }

    function renderApps(apps) {
      if (!apps.length) {
        appGrid.innerHTML = '<div class="muted">Δεν υπάρχουν διαθέσιμες εφαρμογές.</div>';
        return;
      }

      if (!window.PostitCards) {
        appGrid.innerHTML = '<div class="muted">Post-it components are unavailable.</div>';
        return;
      }

      const toneBySlug = {
        'geometry-live': 'green',
        'buffon-needle': 'yellow',
        'fourier-lab': 'indigo',
        'neural-lab': 'orange',
        chess: 'magenta'
      };

      const cardItems = apps.map((app) => {
        if (app.slug === 'geometry-live') {
          const mousePath = '/apps/geometry-live/mouse.html';
          const cameraPath = '/apps/geometry-live/camera.html';

          return {
            id: app.slug,
            slug: app.slug,
            tone: toneBySlug[app.slug],
            title: app.title,
            eyebrow: app.slug,
            description: `${app.description} Επίλεξε είσοδο mouse ή camera.`,
            actions: [
              { kind: 'button', label: 'Mouse με σύνδεση', action: 'open-geometry-mouse-connected' },
              { kind: 'button', label: 'Camera με σύνδεση', action: 'open-geometry-camera-connected' },
              { kind: 'link', label: 'Mouse direct', href: mousePath, variant: 'secondary' },
              { kind: 'link', label: 'Camera direct', href: cameraPath, variant: 'secondary' }
            ]
          };
        }

        const directLink = appendParams(app.launchPath, {
          mode: app.launchPath.includes('mode=') ? undefined : 'client'
        });

        return {
          id: app.slug,
          slug: app.slug,
          tone: toneBySlug[app.slug],
          title: app.title,
          eyebrow: app.slug,
          description: app.description,
          actions: [
            { kind: 'button', label: 'Άνοιγμα με σύνδεση', action: 'open-connected' },
            { kind: 'link', label: 'Direct link (disconnected)', href: directLink, variant: 'secondary' }
          ]
        };
      });

      window.PostitCards.renderAppCards(appGrid, cardItems, (item, action) => {
        if (!item || !action || !action.action) return;
        const app = apps.find((a) => a.slug === item.slug);
        if (!app) return;

        if (action.action === 'open-connected') {
          openAppConnected(app);
          return;
        }

        if (action.action === 'open-geometry-mouse-connected') {
          openAppConnected(app, '/apps/geometry-live/mouse.html');
          return;
        }

        if (action.action === 'open-geometry-camera-connected') {
          openAppConnected(app, '/apps/geometry-live/camera.html');
        }
      });
    }

    async function init() {
      loadName();

      try {
        const apps = await api('/client/apps');
        state.apps = apps;
        renderApps(apps);
        setStatus(`Βρέθηκαν ${apps.length} εφαρμογές.`);
      } catch (error) {
        setStatus(error.message, true);
      }
    }

    document.getElementById('saveNameBtn').addEventListener('click', () => {
      saveName();
      setStatus('Το όνομα αποθηκεύτηκε.');
    });

    nameInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        saveName();
        setStatus('Το όνομα αποθηκεύτηκε.');
      }
    });

    init();
  </script>
  <script src="/js/language-switcher-react.js"></script>
</body>
</html>
