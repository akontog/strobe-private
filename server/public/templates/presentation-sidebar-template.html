<!-- Shared Presentation Sidebar Template -->
<!-- 
  Usage in your app:
  1. Create a <aside class="sidebar" id="sidebar"> element with this structure
  2. Populate it with your own content (toc items)
  3. Initialize with menuButtonTogglesSidebar: true in your deck config
  4. Add a home button: <button class="home-btn" id="homeBtn" title="Αρχική σελίδα">🏠</button>
-->

<style>
  /* Shared sidebar styles - include presentation-shell.css for these to work properly */

  .layout {
    display: flex;
    width: 100%;
    height: 100vh;
  }

  .sidebar {
    position: fixed;
    left: 0;
    top: 0;
    width: var(--presentation-sidebar-width, 290px);
    height: 100vh;
    background: var(--presentation-menu-bg, rgba(15, 23, 42, 0.95));
    border-right: 1px solid var(--presentation-menu-border, rgba(148, 163, 184, 0.35));
    padding: var(--presentation-sidebar-padding, 66px 14px 14px);
    overflow-y: auto;
    overflow-x: hidden;
    z-index: 1000;
    transform: translateX(0);
    transition: transform 0.3s ease;
  }

  .sidebar.hidden {
    transform: translateX(-100%);
  }

  .sidebar.open {
    transform: translateX(0);
  }

  @media (max-width: 900px) {
    .sidebar {
      position: fixed;
      z-index: 999;
      box-shadow: 2px 0 12px rgba(0, 0, 0, 0.4);
    }

    .sidebar.hidden {
      transform: translateX(-100%);
    }

    .sidebar.open {
      transform: translateX(0);
      display: block;
    }
  }

  .sidebar h2 {
    margin: 0 0 16px 0;
    font-size: 1.1rem;
    color: var(--presentation-sidebar-active-color, #e7f2ff);
    border-bottom: 1px solid var(--presentation-menu-border, rgba(148, 163, 184, 0.35));
    padding-bottom: 8px;
  }

  .sidebar a {
    display: block;
    padding: 8px 10px;
    margin: 4px 0;
    color: var(--presentation-menu-color, #f8fafc);
    text-decoration: none;
    border-radius: 6px;
    border-left: 3px solid transparent;
    transition: all 0.2s ease;
  }

  .sidebar a:hover {
    background: var(--presentation-sidebar-hover-bg, rgba(255, 255, 255, 0.08));
    color: var(--presentation-sidebar-hover-color, #f8fafc);
  }

  .sidebar a.active {
    background: var(--presentation-sidebar-active-bg, rgba(255, 255, 255, 0.12));
    border-left-color: var(--presentation-sidebar-active-border, rgba(255, 255, 255, 0.32));
    color: var(--presentation-sidebar-active-color, #e7f2ff);
  }

  .toc-group-title {
    margin: 12px 6px 6px;
    color: var(--presentation-menu-color, #f8fafc);
    font-size: 0.82rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    border-bottom: 1px solid rgba(148, 163, 184, 0.35);
    padding-bottom: 4px;
    cursor: pointer;
    user-select: none;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .toc-group-title::before {
    content: "▾";
    color: var(--accent, #58a6ff);
    font-size: 0.72rem;
    line-height: 1;
  }

  .toc-group-title.collapsed::before {
    content: "▸";
  }

  .content {
    flex: 1;
    margin-left: var(--presentation-sidebar-width, 290px);
    height: 100vh;
    overflow-y: auto;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  @media (max-width: 900px) {
    .content {
      margin-left: 0;
    }

    .sidebar.open ~ .content {
      opacity: 0.5;
    }
  }
</style>
