<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neural Lab - Student</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", Tahoma, sans-serif;
    min-height: 100vh;
    background: radial-gradient(circle at top, #0f172a 0%, #020617 68%);
    color: #e2e8f0;
    display: grid;
    place-items: center;
    padding: 18px;
  }
  .card {
    width: min(560px, 100%);
    background: rgba(15, 23, 42, 0.9);
    border: 1px solid #253247;
    border-radius: 14px;
    padding: 16px;
    display: grid;
    gap: 12px;
  }
  h1 { font-size: 1.1rem; color: #bfdbfe; }
  .status {
    font-size: 0.9rem;
    color: #a5f3fc;
    background: rgba(15, 23, 42, 0.7);
    border: 1px solid #334155;
    border-radius: 999px;
    padding: 6px 10px;
    justify-self: start;
  }
  .name-row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 8px;
  }
  .name-row input {
    border: 1px solid #334155;
    border-radius: 8px;
    background: #020617;
    color: #e2e8f0;
    padding: 8px 10px;
    font-size: 0.95rem;
  }
  .name-row button {
    border: none;
    border-radius: 8px;
    background: #0ea5e9;
    color: #fff;
    font-weight: 700;
    padding: 8px 12px;
    cursor: pointer;
  }
  .assignment {
    border: 1px solid #334155;
    border-radius: 10px;
    background: rgba(15, 23, 42, 0.55);
    padding: 10px;
    font-size: 0.95rem;
  }
  .slider-box {
    border: 1px solid #334155;
    border-radius: 10px;
    background: rgba(15, 23, 42, 0.55);
    padding: 10px;
    display: grid;
    gap: 8px;
  }
  input[type="range"] {
    width: 100%;
    accent-color: #38bdf8;
  }
  .value {
    text-align: right;
    color: #bae6fd;
    font-weight: 700;
  }
  .hint {
    font-size: 0.84rem;
    color: #94a3b8;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Neural Lab (Student)</h1>
    <div class="status" id="statusText">Σύνδεση...</div>

    <div class="name-row">
      <input id="nameInput" type="text" maxlength="28" placeholder="Όνομα μαθητή" />
      <button id="saveNameBtn" type="button">Αποθήκευση</button>
    </div>

    <div class="assignment" id="assignmentBox">Ανάθεση: -</div>

    <div class="slider-box">
      <label id="sliderLabel" for="weightSlider">Weight</label>
      <input id="weightSlider" type="range" min="-2" max="2" step="0.01" value="1" disabled />
      <div class="value" id="sliderValue">1.00</div>
    </div>

    <p class="hint">Ο teacher βλέπει live τη μεταβολή του slider σου και την επίδραση στο αποτέλεσμα.</p>
  </div>

<script>
(() => {
  const INPUTS = {
    wheels: "Αριθμός τροχών",
    hasEngine: "Έχει μηχανή",
    seats: "Αριθμός θέσεων",
    hasPedals: "Έχει πετάλια"
  };

  const statusText = document.getElementById("statusText");
  const assignmentBox = document.getElementById("assignmentBox");
  const slider = document.getElementById("weightSlider");
  const sliderValue = document.getElementById("sliderValue");
  const sliderLabel = document.getElementById("sliderLabel");
  const nameInput = document.getElementById("nameInput");
  const saveNameBtn = document.getElementById("saveNameBtn");

  let ws = null;
  let reconnectTimer = null;
  let assignedInput = null;

  const localName = localStorage.getItem("neuralLabStudentName") || `Student-${Math.floor(Math.random() * 900 + 100)}`;
  nameInput.value = localName;

  function send(type, data = {}) {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send(JSON.stringify({ type, ...data }));
  }

  function registerStudent() {
    const name = String(nameInput.value || "Student").trim().slice(0, 28) || "Student";
    localStorage.setItem("neuralLabStudentName", name);
    send("register_student", { name });
  }

  function updateSliderUi(weight, active) {
    slider.value = String(weight);
    slider.disabled = !active;
    sliderValue.textContent = Number(weight).toFixed(2);
  }

  function applyState(message) {
    if (!message || typeof message !== "object") return;
    const me = message.me || {};
    assignedInput = me.assignedInput || null;

    const assignedLabel = assignedInput ? INPUTS[assignedInput] || assignedInput : "Σε αναμονή ανάθεσης";
    assignmentBox.textContent = `Ανάθεση: ${assignedLabel}`;

    if (!assignedInput) {
      sliderLabel.textContent = "Weight (αναμονή)";
      updateSliderUi(0, false);
      return;
    }

    sliderLabel.textContent = `Weight για: ${assignedLabel}`;
    updateSliderUi(Number(me.weight || 0), true);
  }

  function connect() {
    const proto = location.protocol === "https:" ? "wss" : "ws";
    ws = new WebSocket(`${proto}://${location.host}/ws/neural-lab`);

    ws.addEventListener("open", () => {
      statusText.textContent = "Συνδεδεμένος";
      registerStudent();
    });

    ws.addEventListener("message", (event) => {
      let message;
      try {
        message = JSON.parse(event.data);
      } catch {
        return;
      }

      if (message.type === "canvas_state") {
        applyState(message);
      }
    });

    ws.addEventListener("close", () => {
      statusText.textContent = "Αποσυνδέθηκε - επανασύνδεση...";
      clearTimeout(reconnectTimer);
      reconnectTimer = setTimeout(connect, 900);
    });

    ws.addEventListener("error", () => {
      statusText.textContent = "Σφάλμα σύνδεσης";
    });
  }

  slider.addEventListener("input", () => {
    sliderValue.textContent = Number(slider.value).toFixed(2);
  });

  slider.addEventListener("change", () => {
    if (!assignedInput) return;
    send("student_weight", { value: Number(slider.value) });
  });

  saveNameBtn.addEventListener("click", () => {
    registerStudent();
  });

  connect();
})();
</script>
</body>
</html>
