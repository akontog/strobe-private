<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" rx="18" fill="#E8F5E9"/>
  <!-- Watermelon slice - rind outer -->
  <path d="M30 135 Q100 25 170 135Z" fill="#66BB6A"/>
  <!-- Rind white -->
  <path d="M40 135 Q100 38 160 135Z" fill="#C8E6C9"/>
  <!-- Red flesh -->
  <path d="M50 135 Q100 52 150 135Z" fill="#EF5350"/>
  <!-- Seeds -->
  <ellipse cx="85" cy="108" rx="4" ry="6" fill="#212121" transform="rotate(-15 85 108)"/>
  <ellipse cx="100" cy="100" rx="4" ry="6" fill="#212121"/>
  <ellipse cx="115" cy="108" rx="4" ry="6" fill="#212121" transform="rotate(15 115 108)"/>
  <ellipse cx="93" cy="120" rx="4" ry="6" fill="#212121" transform="rotate(-8 93 120)"/>
  <ellipse cx="108" cy="120" rx="4" ry="6" fill="#212121" transform="rotate(8 108 120)"/>
  <!-- Shine on flesh -->
  <ellipse cx="78" cy="95" rx="8" ry="12" fill="white" opacity="0.25" transform="rotate(-25 78 95)"/>
  <!-- Eyes -->
  <circle cx="88" cy="82" r="4.5" fill="#1B5E20"/>
  <circle cx="112" cy="82" r="4.5" fill="#1B5E20"/>
  <circle cx="89.5" cy="80.5" r="1.8" fill="white"/>
  <circle cx="113.5" cy="80.5" r="1.8" fill="white"/>
  <!-- Blush -->
  <ellipse cx="77" cy="90" rx="9" ry="6" fill="#E53935" opacity="0.3"/>
  <ellipse cx="123" cy="90" rx="9" ry="6" fill="#E53935" opacity="0.3"/>
  <!-- Smile -->
  <path d="M88 92 Q100 103 112 92" stroke="#B71C1C" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Base flat line -->
  <line x1="30" y1="135" x2="170" y2="135" stroke="#388E3C" stroke-width="3" stroke-linecap="round"/>
</svg>
