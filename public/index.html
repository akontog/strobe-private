<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strobe | Entry</title>
  <link rel="stylesheet" type="text/css" href="css/styles.css">
    <link rel="stylesheet" type="text/css" href="css/postit-cards.css">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="/js/postit-cards-react.js"></script>
</head>
<body>
  <div class="status-badge">
        <div class="status-dot"></div>
        <span>Server: <span id="serverStatus">Checking...</span></span>
    </div>

    <div class="container">
        <div class="header" style="display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;">
            <h1><img src="icons/strobelogo.svg" style="height:50px;" alt="Strobe Logo"> | Multi-App Classroom</h1>
        </div>

        <div id="roleCardsRoot"></div>

        

        <div class="footer">
            <img src="icons/mathlogo.png" style="height:50px;" alt="Math Logo">
        </div>
    </div>

    <script>
        async function checkServer() {
            try {
                await fetch('/health');
                document.getElementById('serverStatus').textContent = 'Online ✓';
                document.getElementById('serverStatus').style.color = '#10b981';
            } catch (error) {
                document.getElementById('serverStatus').textContent = 'Offline ✗';
                document.getElementById('serverStatus').style.color = '#ef4444';
            }
        }

        function goTo(path) {
            window.location.href = path;
        }

        function renderRoleCards() {
            const mountNode = document.getElementById('roleCardsRoot');
            if (!mountNode || !window.PostitCards) return;

            const cards = [
                {
                    id: 'teacher',
                    href: '/teacher',
                    icon: '👨‍🏫',
                    tone: 'indigo',
                    title: 'Teacher Dashboard',
                    description: 'Εκκίνηση εφαρμογών σε teacher mode και διαχείριση δραστηριοτήτων ανά app.',
                    features: ['Λίστα εφαρμογών', 'Αποθήκευση/φόρτωση δραστηριοτήτων', 'Παρακολούθηση τάξης']
                },
                {
                    id: 'student',
                    href: '/student',
                    icon: '🧑‍🎓',
                    tone: 'orange',
                    title: 'Student Launcher',
                    description: 'Επιλογή app και ονόματος σύνδεσης. Το launcher μεταφέρει το όνομα στην εφαρμογή.',
                    features: ['Εισαγωγή ονόματος σύνδεσης', 'Άνοιγμα app με auto-connect', 'Direct links για disconnected δοκιμή']
                },
                {
                    id: 'tools',
                    href: '/tools',
                    icon: '🧰',
                    tone: 'green',
                    title: 'Tools',
                    description: 'Εργαλεία για μάθημα και δοκιμές: activity builder, camera-speed-test, linear-seperation.',
                    features: ['Activity Builder', 'Camera Speed Test', 'Linear Seperation']
                }
            ];

            window.PostitCards.renderRoleCards(mountNode, cards);
        }

        checkServer();
        renderRoleCards();
        setInterval(checkServer, 5000);

        document.addEventListener('keydown', (event) => {
            if (event.key === '1') goTo('/teacher');
            if (event.key === '2') goTo('/student');
            if (event.key === '3') goTo('/tools');
        });
    </script>
    <script src="/js/language-switcher-react.js"></script>
</body>
</html>
