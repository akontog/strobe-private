<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" rx="18" fill="#FFFDE7"/>
  <!-- Banana body curved -->
  <path d="M55 140 Q60 80 110 55 Q145 40 155 60 Q162 75 145 85 Q120 70 95 95 Q70 118 75 155 Q60 158 55 140Z" fill="#FFEE58"/>
  <!-- Banana shadow/depth -->
  <path d="M58 138 Q63 85 112 60 Q142 46 152 62" stroke="#F9A825" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Banana tip top -->
  <path d="M108 56 Q120 42 130 45 Q142 48 145 60" fill="#8D6E63" stroke="#6D4C41" stroke-width="1.5"/>
  <!-- Banana tip bottom -->
  <path d="M72 153 Q68 165 74 170 Q82 173 88 163" fill="#8D6E63" stroke="#6D4C41" stroke-width="1.5"/>
  <!-- Shine -->
  <path d="M80 110 Q88 85 105 72" stroke="white" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.5"/>
  <!-- Eyes -->
  <circle cx="130" cy="72" r="4" fill="#4E342E"/>
  <circle cx="143" cy="70" r="4" fill="#4E342E"/>
  <circle cx="131.5" cy="70.5" r="1.5" fill="white"/>
  <circle cx="144.5" cy="68.5" r="1.5" fill="white"/>
  <!-- Smile -->
  <path d="M128 80 Q136 87 144 80" stroke="#5D4037" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Blush -->
  <ellipse cx="122" cy="78" rx="8" ry="5" fill="#FFB300" opacity="0.45"/>
</svg>
