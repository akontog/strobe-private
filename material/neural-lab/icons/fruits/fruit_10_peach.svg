<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" rx="18" fill="#FFF8E1"/>
  <!-- Leaf -->
  <ellipse cx="110" cy="48" rx="16" ry="9" fill="#66BB6A" transform="rotate(-20 110 48)"/>
  <!-- Stem -->
  <line x1="100" y1="58" x2="104" y2="46" stroke="#5D4037" stroke-width="3" stroke-linecap="round"/>
  <!-- Peach body -->
  <circle cx="100" cy="112" r="55" fill="#FFAB91"/>
  <!-- Peach crease -->
  <path d="M100 60 Q92 85 92 112 Q92 138 98 162" stroke="#FF7043" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6"/>
  <!-- Blush/color variation -->
  <ellipse cx="120" cy="95" rx="25" ry="30" fill="#FF8A65" opacity="0.3"/>
  <!-- Shine -->
  <ellipse cx="78" cy="88" rx="11" ry="16" fill="white" opacity="0.35" transform="rotate(-20 78 88)"/>
  <!-- Eyes -->
  <circle cx="88" cy="110" r="5" fill="#4E342E"/>
  <circle cx="112" cy="110" r="5" fill="#4E342E"/>
  <circle cx="89.5" cy="108.5" r="2" fill="white"/>
  <circle cx="113.5" cy="108.5" r="2" fill="white"/>
  <!-- Blush cheeks -->
  <ellipse cx="76" cy="120" rx="11" ry="7" fill="#FF5722" opacity="0.3"/>
  <ellipse cx="124" cy="120" rx="11" ry="7" fill="#FF5722" opacity="0.3"/>
  <!-- Smile -->
  <path d="M87 122 Q100 134 113 122" stroke="#BF360C" stroke-width="2.5" fill="none" stroke-linecap="round"/>
</svg>
