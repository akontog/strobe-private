  <ellipse cx="105" cy="38" rx="14" ry="8" fill="#66BB6A" transform="rotate(-30 105 38)"/>
  <line x1="100" y1="42" x2="105" y2="32" stroke="#4CAF50" stroke-width="2" stroke-linecap="round"/>
  <!-- Stem -->
  <line x1="100" y1="55" x2="102" y2="42" stroke="#5D4037" stroke-width="3" stroke-linecap="round"/>
  <!-- Apple body -->
  <path d="M100 60 C72 60 52 80 52 108 C52 138 70 158 88 160 C94 161 97 158 100 158 C103 158 106 161 112 160 C130 158 148 138 148 108 C148 80 128 60 100 60Z" fill="#EF5350"/>
  <!-- Apple shine -->
  <ellipse cx="80" cy="85" rx="10" ry="14" fill="white" opacity="0.35" transform="rotate(-20 80 85)"/>
  <!-- Apple cheek blush -->
  <ellipse cx="128" cy="118" rx="11" ry="8" fill="#E53935" opacity="0.4"/>
  <!-- Smile -->
  <path d="M88 125 Q100 135 112 125" stroke="#B71C1C" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Eyes -->
  <circle cx="88" cy="110" r="4" fill="#4E342E"/>
  <circle cx="112" cy="110" r="4" fill="#4E342E"/>
  <circle cx="89.5" cy="108.5" r="1.5" fill="white"/>
  <circle cx="113.5" cy="108.5" r="1.5" fill="white"/>
</svg>
